# Production configuration with automatic HTTPS via Caddy
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Ports are configurable via WEB_HTTP_PORT / WEB_HTTPS_PORT (defaults 8081/8443)

services:
  caddy:
    image: caddy:2-alpine
    container_name: symfony_caddy
    restart: always
    ports:
      - "${WEB_HTTP_PORT:-8081}:80"
      - "${WEB_HTTPS_PORT:-8443}:443"
      - "${WEB_HTTPS_PORT:-8443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      WEB_HTTPS_PORT: ${WEB_HTTPS_PORT:-8443}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - symfony
    depends_on:
      - nginx

  nginx:
    # Nginx no longer exposes ports; Caddy handles public traffic + HTTPS
    ports: !reset []
    restart: always
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    volumes: !reset []

  db:
    restart: always
    ports: !reset []
    environment:
      MYSQL_DATABASE: ${DB_NAME:-symfony}
      MYSQL_USER: ${DB_USER:-symfony}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mailhog:
    profiles: ["debug"]

volumes:
  caddy_data:
  caddy_config:
